<div style="background-color: #000000; padding: 40px 16px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin: 0 auto;">
    <!-- Brand header -->
    <tr>
      <td style="padding-bottom: 24px; text-align: center;">
        <div style="color: #ffffff; font-size: 18px; font-weight: 800; letter-spacing: -0.5px;">
          Pritzy&nbsp;Ventures
        </div>
        <div style="color: rgba(255, 255, 255, 0.3); font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-top: 6px;">
          New Contact Inquiry
        </div>
      </td>
    </tr>

    <!-- Card -->
    <tr>
      <td style="background-color: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 32px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <!-- Sender -->
          <tr>
            <td style="padding-bottom: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align: middle;">
                    <div style="width: 44px; height: 44px; line-height: 44px; text-align: center; background-color: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%; color: #ffffff; font-size: 18px; font-weight: 700;" role="img">
                      👤
                    </div>
                  </td>
                  <td style="vertical-align: middle; padding-left: 14px;">
                    <div style="color: #ffffff; font-size: 16px; font-weight: 700;">{{name}}</div>
                    <div style="color: rgba(255, 255, 255, 0.4); font-size: 13px; margin-top: 2px;">
                      <a href="mailto:{{email}}" style="color: rgba(255, 255, 255, 0.4); text-decoration: none;">{{email}}</a>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Details -->
          <tr>
            <td style="padding-top: 24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="50%" style="padding-right: 6px;">
                    <div style="background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 14px 16px;">
                      <div style="color: rgba(255, 255, 255, 0.3); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;">Subject</div>
                      <div style="color: rgba(255, 255, 255, 0.7); font-size: 14px; font-weight: 500;">{{subject}}</div>
                    </div>
                  </td>
                  <td width="50%" style="padding-left: 6px;">
                    <div style="background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 14px 16px;">
                      <div style="color: rgba(255, 255, 255, 0.3); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;">Company</div>
                      <div style="color: rgba(255, 255, 255, 0.7); font-size: 14px; font-weight: 500;">{{company}}</div>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="padding-top: 12px;">
              <div style="background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 18px 16px;">
                <div style="color: rgba(255, 255, 255, 0.3); font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;">Message</div>
                <div style="color: rgba(255, 255, 255, 0.85); font-size: 14px; line-height: 1.7; white-space: pre-wrap;">{{message}}</div>
              </div>
            </td>
          </tr>

          <!-- Reply button -->
          <tr>
            <td style="padding-top: 28px; text-align: center;">
              <a href="mailto:{{email}}?subject=Re:%20{{subject}}" style="display: inline-block; background-color: #ffffff; color: #000000; font-size: 14px; font-weight: 700; padding: 13px 32px; border-radius: 12px; text-decoration: none;">
                Reply to {{name}} →
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="padding-top: 24px; text-align: center;">
        <div style="color: rgba(255, 255, 255, 0.25); font-size: 11px; line-height: 1.6;">
          Sent from the contact form at
          <a href="https://pritzyventures.com" style="color: rgba(255, 255, 255, 0.4); text-decoration: none; font-weight: 600;">pritzyventures.com</a>
        </div>
      </td>
    </tr>
  </table>
</div>
